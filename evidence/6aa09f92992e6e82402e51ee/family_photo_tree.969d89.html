<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Brown fam</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    /* General page styling */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      padding: 40px 20px;
      overflow-x: auto;
      font-family: "Poppins", sans-serif;
      background:
        radial-gradient(circle at top left, #d2d2d4, transparent 45%),
        linear-gradient(135deg, #c6c6c8, #b4b4b7);
    }

    /* Main title */
    .page-title {
      margin-bottom: 45px;
      color: #245c46;
      font-size: clamp(2.2rem, 5vw, 3.8rem);
      font-weight: 700;
      letter-spacing: 2px;
      text-align: center;
    }

    /* Main family tree area */
    .family-tree {
      position: relative;
      width: 820px;
      min-height: 510px;
      margin: 0 auto;
      padding: 40px 30px;
      background-color: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(36, 92, 70, 0.12);
      border-radius: 24px;
      box-shadow: 0 18px 45px rgba(38, 71, 57, 0.12);
    }

    /* Card design */
    .node {
      position: relative;
      z-index: 2;
      display: flex;
      width: 150px;
      height: 150px;
      align-items: center;
      justify-content: center;
      background-color: #ffffff;
      border: 2px solid #9ed9bd;
      border-radius: 18px;
      box-shadow: 0 8px 20px rgba(49, 93, 76, 0.12);
      transition:
        transform 0.25s ease,
        border-color 0.25s ease,
        box-shadow 0.25s ease;
    }

    .node:hover {
      transform: translateY(-6px);
      border-color: #3d9b73;
      box-shadow: 0 14px 28px rgba(49, 93, 76, 0.2);
    }

    /* Placeholder image */
    .node img {
      width: 105px;
      height: 105px;
      object-fit: cover;
      border: 4px solid #e1f4eb;
      border-radius: 50%;
    }

    /* Two people at the top */
    .top-layer {
      position: relative;
      display: flex;
      z-index: 2;
      justify-content: center;
      gap: 50px;
    }

    /* Four people below */
    .bottom-layer {
      position: relative;
      display: flex;
      z-index: 2;
      justify-content: center;
      gap: 24px;
      margin-top: 110px;
    }

    /* Line joining the two people above */
    .couple-line {
      position: absolute;
      z-index: 1;
      top: 114px;
      left: calc(50% - 25px);
      width: 50px;
      height: 3px;
      background-color: #79b99e;
    }

    /* Shared vertical line coming from the top couple */
    .center-line {
      position: absolute;
      z-index: 1;
      top: 114px;
      left: 50%;
      width: 3px;
      height: 106px;
      background-color: #79b99e;
      transform: translateX(-50%);
    }

    /* Horizontal line shared by all four people below */
    .children-line {
      position: absolute;
      z-index: 1;
      top: 218px;
      left: 149px;
      width: 522px;
      height: 3px;
      background-color: #79b99e;
    }

    /* Vertical lines connecting the four lower cards */
    .bottom-layer .node::before {
      position: absolute;
      top: -42px;
      left: 50%;
      width: 3px;
      height: 42px;
      background-color: #79b99e;
      content: "";
      transform: translateX(-50%);
    }

    /* Responsive layout */
    @media (max-width: 850px) {
      body {
        padding: 25px 10px;
      }

      .page-title {
        margin-bottom: 30px;
      }

      /*
        The tree keeps its structure on small screens.
        Horizontal scrolling prevents the lines from breaking.
      */
      .family-tree {
        width: 720px;
        min-width: 720px;
      }

      .node {
        width: 130px;
        height: 140px;
      }

      .node img {
        width: 95px;
        height: 95px;
      }

      .bottom-layer {
        gap: 20px;
      }

      .couple-line {
        top: 109px;
      }

      .center-line {
        top: 109px;
        height: 106px;
      }

      .children-line {
        top: 213px;
        left: 125px;
        width: 470px;
      }
    }

    /* Family logo, top-right corner */
    .page-logo {
      position: absolute;
      top: 24px;
      right: 24px;
      width: 120px;
      height: auto;
      z-index: 5;
    }

    @media (max-width: 850px) {
      .page-logo {
        width: 88px;
        top: 14px;
        right: 14px;
      }
    }
  </style>
</head>
